# Hooki pre-commit (opcjonalne, dla deweloperów). Instalacja:
#   pip install pre-commit && pre-commit install
# Uruchamiają ruff (lint + format) na zmienianych plikach przed commitem.
# Świadomie NIE uruchamiamy tu pytest (wolne) — testy pilnuje bramka CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
