name: Buduj obraz bazowy ML

# Buduje CIĘŻKI obraz bazowy (Dockerfile.base: torch + cała ML/OCR/CV) i wypycha
# go do GHCR. Dzięki temu właściwy deploy aplikacji (Dockerfile.slim) robi tylko
# `COPY . .` i trwa ~1 min zamiast 7-8.
#
# Odpala się:
#   • ręcznie (workflow_dispatch) — np. pierwsza publikacja,
#   • automatycznie po zmianie requirements.txt lub Dockerfile.base na main.
#
# Po PIERWSZEJ publikacji trzeba JEDNORAZOWO ustawić pakiet GHCR jako publiczny
# (albo dać Coolify dane logowania do GHCR) — szczegóły: docs/OBRAZ_BAZOWY_ML.md

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.base'
      - 'requirements.txt'
      - '.github/workflows/ml-base-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Zwolnij miejsce na dysku (torch+paddle+doctr to kilka GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Nazwa właściciela małymi literami (wymóg GHCR)
        id: meta
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push obrazu bazowego
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/doccompare-ml-base:latest
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/doccompare-ml-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
