<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Zaloguj się do platformy DocCompare — weryfikacja dokumentów handlowych ACME">
<meta name="theme-color" content="#0f1119">
<title>Logowanie — DocCompare</title>
<style>
:root{
  --bg:#0f1119;--surface:#181b27;--border:#252840;
  --accent:#5b9bff;--text:#edf0f7;--muted:#7a84a0;
  --error:#ff5c5c;--ok:#3ddba0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center}
.bg-grid{position:fixed;inset:0;
  background-image:linear-gradient(rgba(79,142,247,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(79,142,247,.03) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none}
.bg-glow{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);
  width:700px;height:700px;
  background:radial-gradient(ellipse,rgba(91,155,255,.07) 0%,rgba(124,106,247,.04) 40%,transparent 70%);
  pointer-events:none}
.card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:40px 36px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.brand-icon{width:38px;height:38px;
  background:linear-gradient(135deg,rgba(91,155,255,.2),rgba(124,106,247,.15));
  border:1px solid rgba(91,155,255,.3);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-text{display:flex;flex-direction:column}
.brand-name{font-size:14px;font-weight:700;
  background:linear-gradient(90deg,#5b9bff,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.5}
.field{margin-bottom:18px}
label{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;font-weight:600}
input[type=text],input[type=password],input[type=email]{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;
  padding:11px 14px;color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,155,255,.12)}
.remember-row{display:flex;align-items:center;justify-content:flex-end;margin-bottom:20px}
.forgot-link{font-size:13px;color:var(--accent);text-decoration:none;transition:opacity .15s}
.forgot-link:hover{opacity:.75}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;
  border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
  transition:opacity .15s,transform .1s;letter-spacing:.2px}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.99)}
.err{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.2);border-radius:8px;
  padding:10px 14px;font-size:13px;color:var(--error);margin-top:16px;
  display:flex;align-items:flex-start;gap:8px;line-height:1.5}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="card">
  <div class="brand">
    <div class="brand-icon">🏥</div>
    <div class="brand-text">
      <div class="brand-name">DocCompare</div>
      <div class="brand-sub">ACME</div>
    </div>
  </div>
  <h1>Zaloguj się</h1>
  <p class="sub">Platforma weryfikacji dokumentów i artworków</p>
  <form method="POST" autocomplete="on">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="identifier">Email lub login</label>
      <input type="text" id="identifier" name="identifier" autofocus autocomplete="username"
             placeholder="jan@example.com lub jan.kowalski" required aria-required="true">
    </div>
    <div class="field">
      <label for="password">Hasło</label>
      <div style="position:relative">
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="••••••••" required style="padding-right:40px" aria-required="true">
        <button type="button" id="pwToggle"
                style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;color:var(--muted);
                       font-size:16px;padding:2px;line-height:1"
                aria-label="Pokaż/ukryj hasło"
                onclick="(function(){var i=document.getElementById('password');var b=document.getElementById('pwToggle');if(i.type==='password'){i.type='text';b.textContent='🙈';}else{i.type='password';b.textContent='👁';}}())">👁</button>
      </div>
    </div>
    <div class="remember-row">
      <a href="/forgot-password" class="forgot-link">Nie pamiętam hasła</a>
    </div>
    <button type="submit" class="btn">Zaloguj się →</button>
    {% if error %}<div class="err"><span>⚠</span><span>{{ error }}</span></div>{% endif %}
  </form>
</div>
</body>
</html>
