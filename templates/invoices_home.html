{% extends "base.html" %}
{% block page_title %}Faktury{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <h1 class="text-lg font-semibold mb-4">Faktury → Excel</h1>
  <form method="post" action="{{ url_for('invoices.upload') }}" enctype="multipart/form-data" class="space-y-3">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm font-medium mb-1">Dostawca (opcjonalnie — inaczej auto-rozpoznaj)</label>
      <select name="supplier_code" class="border rounded px-2 py-1 w-full">
        <option value="">— auto-rozpoznaj —</option>
        {% for s in suppliers %}
        <option value="{{ s.code }}">{{ s.name or s.code }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Pliki PDF (można wiele naraz)</label>
      <input type="file" name="pdf" multiple accept="application/pdf" required class="border rounded px-2 py-1 w-full">
    </div>
    <button type="submit" class="px-3 py-1.5 bg-indigo-600 text-white rounded hover:bg-indigo-700">Wyślij do przetworzenia</button>
  </form>
  <p class="mt-4"><a class="text-indigo-600 underline" href="{{ url_for('invoices.coverage') }}">Panel pokrycia</a> ·
     <a class="text-indigo-600 underline" href="{{ url_for('invoices.master') }}">Baza materiałowa</a></p>
</div>
{% endblock %}
