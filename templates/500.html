{% extends "base.html" %}
{% block title %}500 — Błąd serwera{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center text-center" style="min-height:65vh;padding:40px 20px">
  <div style="font-size:72px;margin-bottom:16px;opacity:.35" aria-hidden="true">⚙️</div>
  <h1 class="text-[64px] font-extrabold leading-none mb-2 text-red-600">500</h1>
  <p class="text-[18px] font-semibold mb-2" style="color:var(--ink)">Błąd serwera</p>
  <p class="text-[14px] mb-7" style="color:var(--ink-3);max-width:440px;line-height:1.6">
    Coś poszło nie tak po naszej stronie. Spróbuj ponownie za chwilę lub skontaktuj się z administratorem.
  </p>
  <div class="flex gap-3 flex-wrap justify-center">
    <a href="/" class="btn btn-primary">
      <i data-lucide="home" style="width:15px;height:15px;" aria-hidden="true"></i> Strona główna
    </a>
    <button type="button" onclick="history.back()" class="btn btn-ghost">
      <i data-lucide="arrow-left" style="width:15px;height:15px;" aria-hidden="true"></i> Wróć
    </button>
  </div>
</div>
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();});</script>
{% endblock %}
